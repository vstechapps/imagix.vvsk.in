<nav class="sidebar" [class.open]="layoutService.sidebarOpen()">
    <ul>
        <li><a routerLink="/dashboard" routerLinkActive="active" (click)="closeSidebar()">Projects</a></li>
        <li><a routerLink="/fonts" routerLinkActive="active" (click)="closeSidebar()">Fonts</a></li>

        <ng-container *ngIf="currentProjectId()">
            <li class="section-label">{{ activeProject()?.name || 'Current Project' }}</li>
            <li><a [routerLink]="['/projects', currentProjectId(), 'media']" routerLinkActive="active"
                    (click)="closeSidebar()">Media</a></li>
            <li><a [routerLink]="['/projects', currentProjectId(), 'layers']" routerLinkActive="active"
                    (click)="closeSidebar()">Layers</a></li>
            <li><a [routerLink]="['/projects', currentProjectId(), 'preview']" routerLinkActive="active"
                    (click)="closeSidebar()">Preview</a></li>
            <li class="divider"></li>
        </ng-container>
    </ul>
</nav>
<div class="overlay" *ngIf="layoutService.sidebarOpen()" (click)="closeSidebar()"></div>
