<div class="project-container">
  <header class="project-header">
    <div>
      <p class="eyebrow">Project</p>
      <h1 *ngIf="!isLoading()">{{ project()?.name || 'Loading...' }}</h1>
      <h1 *ngIf="isLoading()">Loading...</h1>
    </div>
    <div class="actions">
      <button class="btn secondary" (click)="saveProject()">Save</button>
      <button class="btn secondary">Export</button>
      <button class="btn primary">Render</button>
    </div>
  </header>

  <section class="editor">
    <app-preview [project]="project()"></app-preview>

    <app-timeline [layers]="layers()" (mediaDrop)="onMediaDrop($event)">
    </app-timeline>
  </section>

  <!-- Media Library Component -->
  <app-media [projectId]="projectId" [initialMedia]="projectMedia()" (mediaChange)="onMediaChange($event)"></app-media>
</div>
