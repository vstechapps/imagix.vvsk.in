<div class="fonts-container">
    <h2>Fonts</h2>

    <form [formGroup]="fontForm" (ngSubmit)="save()" class="font-form">
        <input placeholder="Font name" formControlName="name" />
        <input placeholder="Font source URL" formControlName="source" />

        <label class="toggle">
            <input type="checkbox" formControlName="enabled" />
            <span>Enabled</span>
        </label>

        <button type="submit" class="primary">
            {{ editingId ? 'Update' : 'Add' }} Font
        </button>
    </form>

    <div class="font-list">
        <div class="font-row" *ngFor="let font of fonts$ | async">
            <div class="info">
                <div class="font-name">
                    {{ font.name }}
                </div>

                <div class="font-source">
                    {{ font.source }}
                </div>
            </div>

            <label class="switch">
                <input type="checkbox" [checked]="font.enabled" (change)="toggle(font)" />
                <span class="slider"></span>
            </label>

            <div class="actions">
                <button class="icon-btn edit" title="Edit font" (click)="edit(font)">
                    ✏️
                </button>

                <button class="icon-btn delete" title="Delete font" (click)="delete(font.id!)">
                    🗑️
                </button>
            </div>
        </div>
    </div>
</div>
