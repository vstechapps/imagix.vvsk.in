<div class="timeline-container" (dragover)="onDragOver($event)" (drop)="onDrop($event)">
    <div class="timeline-header">
        <h3>Timeline</h3>
    </div>
    <div class="timeline-tracks">
        <div class="track" *ngFor="let layer of layers">
            <div class="layer-info">
                {{ layer.name }}
            </div>
            <div class="layer-content">
                <div class="clip" [ngStyle]="getClipStyle(layer)">
                    <span class="clip-label">{{ layer.type }}</span>
                </div>
            </div>
        </div>
        <div class="drop-zone" *ngIf="isDragging">
            Drop here to add to timeline
        </div>
    </div>
</div>
