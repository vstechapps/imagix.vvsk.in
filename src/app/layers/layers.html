<div class="layers-container">
    <div class="header">
        <h2>Layers</h2>
        <button class="add-btn" (click)="openAddLayerDialog()">+ Add Layer</button>
    </div>

    <div class="layers-list">
        <div class="layer-item" *ngFor="let layer of layers()">
            <div class="layer-info">
                <span class="layer-name">{{ layer.name }}</span>
                <span class="layer-type-badge">{{ layer.type }}</span>
            </div>
            <div class="layer-actions">
                <button class="icon-btn edit-btn" (click)="openEditLayerDialog(layer)" title="Edit Layer">
                    ✎
                </button>
                <button class="icon-btn delete-btn" (click)="deleteLayer(layer)" title="Delete Layer">
                    ×
                </button>
            </div>
        </div>

        <div class="empty-state" *ngIf="layers().length === 0">
            <p>No layers added yet.</p>
        </div>
    </div>
</div>

<!-- Add Layer Dialog -->
<div class="dialog-overlay" *ngIf="showAddLayerDialog()" (click)="closeAddLayerDialog()">
    <div class="dialog" (click)="$event.stopPropagation()">
        <h3>Add New Layer</h3>

        <div class="form-group">
            <label>Name</label>
            <input type="text" [ngModel]="newLayerName()" (ngModelChange)="newLayerName.set($event)"
                placeholder="Layer Name">
        </div>

        <div class="form-group">
            <label>Type</label>
            <select [ngModel]="newLayerType()" (ngModelChange)="newLayerType.set($event)">
                <option value="Visual">Visual</option>
                <option value="Text">Text</option>
                <option value="Image">Image</option>
                <option value="Audio">Audio</option>
                <option value="Video">Video</option>
            </select>
        </div>

        <div class="dialog-actions">
            <button class="cancel-btn" (click)="closeAddLayerDialog()">Cancel</button>
            <button class="save-btn" (click)="addLayer()">Add</button>
        </div>
    </div>
</div>

<!-- Edit Layer Dialog -->
<div class="dialog-overlay" *ngIf="showEditLayerDialog() && editingLayer" (click)="closeEditLayerDialog()">
    <div class="dialog" (click)="$event.stopPropagation()">
        <h3>Edit Layer</h3>

        <div class="form-row">
            <div class="form-group half">
                <label>Name</label>
                <input type="text" [(ngModel)]="editingLayer.name" placeholder="Layer Name">
            </div>
            <div class="form-group half">
                <label>Enabled</label>
                <input type="checkbox" [(ngModel)]="editingLayer.enabled">
            </div>
        </div>

        <!-- Dynamic properties based on type -->
        <ng-container [ngSwitch]="editingLayer.type">

            <!-- Common props -->
            <div class="form-row">
                <div class="form-group half">
                    <label>Start Time (s)</label>
                    <input type="number" [(ngModel)]="editingLayer.startTime" step="0.1" min="0">
                </div>
                <div class="form-group half">
                    <label>Duration (s)</label>
                    <input type="number" [(ngModel)]="editingLayer.duration" step="0.1" min="0.1">
                </div>
            </div>

            <div class="form-row" *ngIf="editingLayer.type !== 'Audio'">
                <div class="form-group half">
                    <label>Width</label>
                    <input type="number" [(ngModel)]="editingLayer.width">
                </div>
                <div class="form-group half">
                    <label>Height</label>
                    <input type="number" [(ngModel)]="editingLayer.height">
                </div>
            </div>

            <div class="form-row" *ngIf="editingLayer.type !== 'Audio'">
                <div class="form-group half">
                    <label>X</label>
                    <input type="number" [(ngModel)]="editingLayer.x">
                </div>
                <div class="form-group half">
                    <label>Y</label>
                    <input type="number" [(ngModel)]="editingLayer.y">
                </div>
            </div>

            <!-- Text Specific -->
            <ng-container *ngSwitchCase="'Text'">
                <div class="form-group">
                    <label>Text Content</label>
                    <input type="text" [(ngModel)]="editingLayer.text">
                </div>
                <div class="form-group">
                    <label>Font</label>
                    <input type="text" [(ngModel)]="editingLayer.font" placeholder="e.g 24px Arial">
                </div>
                <div class="form-group">
                    <label>Color</label>
                    <input type="color" [(ngModel)]="editingLayer.color">
                </div>
                <div class="form-group">
                    <label>Opacity</label>
                    <input type="number" [(ngModel)]="editingLayer.opacity" step="0.1" min="0" max="1">
                </div>
                <div class="form-row">
                    <div class="form-group half">
                        <label>Text Alloc X</label>
                        <input type="number" [(ngModel)]="editingLayer.textX">
                    </div>
                    <div class="form-group half">
                        <label>Text Alloc Y</label>
                        <input type="number" [(ngModel)]="editingLayer.textY">
                    </div>
                </div>
                <div class="form-group">
                    <label>Text Align</label>
                    <select [(ngModel)]="editingLayer.textAlign">
                        <option value="left">Left</option>
                        <option value="center">Center</option>
                        <option value="right">Right</option>
                        <option value="start">Start</option>
                        <option value="end">End</option>
                    </select>
                </div>
            </ng-container>

            <!-- Visual Specific (Rect/Image placeholder) -->
            <ng-container *ngSwitchCase="'Visual'">
                <div class="form-group">
                    <label>Background Color</label>
                    <input type="color" [(ngModel)]="editingLayer.background">
                </div>
                <div class="form-group">
                    <label>Opacity</label>
                    <input type="number" [(ngModel)]="editingLayer.opacity" step="0.1" min="0" max="1">
                </div>
                <!-- Check if border object exists before trying to bind -->
                <div class="form-group" *ngIf="editingLayer.border">
                    <label>Border Color</label>
                    <input type="color" [(ngModel)]="editingLayer.border.color">
                </div>
                <div class="form-group" *ngIf="editingLayer.border">
                    <label>Border Thickness</label>
                    <input type="number" [(ngModel)]="editingLayer.border.thickness">
                </div>
            </ng-container>

            <!-- Image Specific -->
            <ng-container *ngSwitchCase="'Image'">
                <div class="form-group">
                    <label>Source URL</label>
                    <input type="text" [(ngModel)]="editingLayer.source">
                </div>
                <div class="form-row">
                    <div class="form-group half">
                        <label>Dest Width</label>
                        <input type="number" [(ngModel)]="editingLayer.destWidth">
                    </div>
                    <div class="form-group half">
                        <label>Dest Height</label>
                        <input type="number" [(ngModel)]="editingLayer.destHeight">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group half">
                        <label>Dest X</label>
                        <input type="number" [(ngModel)]="editingLayer.destX">
                    </div>
                    <div class="form-group half">
                        <label>Dest Y</label>
                        <input type="number" [(ngModel)]="editingLayer.destY">
                    </div>
                </div>
                <div class="form-group">
                    <label>Opacity</label>
                    <input type="number" [(ngModel)]="editingLayer.opacity" step="0.1" min="0" max="1">
                </div>
            </ng-container>

            <!-- Video Specific -->
            <ng-container *ngSwitchCase="'Video'">
                <div class="form-group">
                    <label>Source URL</label>
                    <input type="text" [(ngModel)]="editingLayer.source">
                </div>
                <div class="form-row">
                    <div class="form-group half">
                        <label>Source Width</label>
                        <input type="number" [(ngModel)]="editingLayer.sourceWidth">
                    </div>
                    <div class="form-group half">
                        <label>Source Height</label>
                        <input type="number" [(ngModel)]="editingLayer.sourceHeight">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group half">
                        <label>Dest Width</label>
                        <input type="number" [(ngModel)]="editingLayer.destWidth">
                    </div>
                    <div class="form-group half">
                        <label>Dest Height</label>
                        <input type="number" [(ngModel)]="editingLayer.destHeight">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group half">
                        <label>Source Start Time</label>
                        <input type="number" [(ngModel)]="editingLayer.sourceStartTime">
                    </div>
                    <div class="form-group half">
                        <label>Opacity</label>
                        <input type="number" [(ngModel)]="editingLayer.opacity" step="0.1" min="0" max="1">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group half">
                        <label>Volume</label>
                        <input type="number" [(ngModel)]="editingLayer.volume" step="0.1" min="0" max="1">
                    </div>
                    <div class="form-group half">
                        <label>Muted</label>
                        <input type="checkbox" [(ngModel)]="editingLayer.muted">
                    </div>
                </div>
            </ng-container>

            <!-- Audio Specific -->
            <ng-container *ngSwitchCase="'Audio'">
                <div class="form-group">
                    <label>Source URL</label>
                    <input type="text" [(ngModel)]="editingLayer.source">
                </div>
                <div class="form-row">
                    <div class="form-group half">
                        <label>Volume</label>
                        <input type="number" [(ngModel)]="editingLayer.volume" step="0.1" min="0" max="1">
                    </div>
                    <div class="form-group half">
                        <label>Muted</label>
                        <input type="checkbox" [(ngModel)]="editingLayer.muted">
                    </div>
                </div>
                <div class="form-group">
                    <label>Playback Rate</label>
                    <input type="number" [(ngModel)]="editingLayer.playbackRate" step="0.1">
                </div>
            </ng-container>

        </ng-container>

        <div class="dialog-actions">
            <button class="cancel-btn" (click)="closeEditLayerDialog()">Cancel</button>
            <button class="save-btn" (click)="saveLayerChanges()">Save Changes</button>
        </div>
    </div>
</div>
